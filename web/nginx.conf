server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /circuitjs.html?startCircuit=keyboard-matrix-5.txt&running=true&IECGates=true;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
